import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against the PacketEvents API that matches the embedded runtime.
    compileOnly "com.github.retrooper:packetevents-api:${project.packetevents_version}"

    // PacketEvents stays embedded so server owners only install one physical JAR.
    // Its stock Fabric mixins are disabled below and ZNPCsPlus attaches it only after
    // Velocity LOGIN, at compression-aware CONFIGURATION/PLAY pipeline positions.
    modRuntimeOnly "maven.modrinth:HYKaKraK:A46QemnN"
    include "maven.modrinth:HYKaKraK:A46QemnN"

    // Storage/import support. Loom includes these as nested runtime libraries.
    include implementation('org.yaml:snakeyaml:2.3')
    include implementation('org.xerial:sqlite-jdbc:3.46.1.3')
    include implementation('com.mysql:mysql-connector-j:9.0.0')
    include implementation('net.kyori:adventure-api:4.18.0')
    include implementation('net.kyori:adventure-text-minimessage:4.18.0')
    include implementation('net.kyori:adventure-text-serializer-legacy:4.18.0')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE')
    from('UPSTREAM-NOTICE.md')
}

// Rewrites one UTF-8 constant in a Java class file without changing any other bytecode.
// PacketEvents 2.11.1's Fabric artifact was compiled against a later 1.21.x intermediary
// name for WorldVersion#getId(): comp_4024(). Minecraft 1.21.1 uses method_48018().
def patchClassUtf8Constant = { File classFile, String oldValue, String newValue ->
    if (!classFile.isFile()) {
        throw new GradleException("Class file to patch was not found: ${classFile}")
    }

    def input = new DataInputStream(new ByteArrayInputStream(classFile.bytes))
    def bytes = new ByteArrayOutputStream()
    def output = new DataOutputStream(bytes)

    int magic = input.readInt()
    if (magic != 0xCAFEBABE as int) {
        throw new GradleException("Not a Java class file: ${classFile}")
    }
    output.writeInt(magic)
    output.writeShort(input.readUnsignedShort()) // minor
    output.writeShort(input.readUnsignedShort()) // major

    int constantPoolCount = input.readUnsignedShort()
    output.writeShort(constantPoolCount)
    int replacements = 0

    for (int i = 1; i < constantPoolCount; i++) {
        int tag = input.readUnsignedByte()
        output.writeByte(tag)
        switch (tag) {
            case 1: // CONSTANT_Utf8
                int length = input.readUnsignedShort()
                byte[] utf = new byte[length]
                input.readFully(utf)
                String value = new String(utf, java.nio.charset.StandardCharsets.UTF_8)
                byte[] rewritten = value == oldValue
                        ? newValue.getBytes(java.nio.charset.StandardCharsets.UTF_8)
                        : utf
                if (value == oldValue) replacements++
                output.writeShort(rewritten.length)
                output.write(rewritten)
                break
            case 3: // Integer
            case 4: // Float
                output.writeInt(input.readInt())
                break
            case 5: // Long
            case 6: // Double
                output.writeLong(input.readLong())
                i++ // long/double consume two constant-pool slots
                break
            case 7:  // Class
            case 8:  // String
            case 16: // MethodType
            case 19: // Module
            case 20: // Package
                output.writeShort(input.readUnsignedShort())
                break
            case 9:  // Fieldref
            case 10: // Methodref
            case 11: // InterfaceMethodref
            case 12: // NameAndType
            case 17: // Dynamic
            case 18: // InvokeDynamic
                output.writeShort(input.readUnsignedShort())
                output.writeShort(input.readUnsignedShort())
                break
            case 15: // MethodHandle
                output.writeByte(input.readUnsignedByte())
                output.writeShort(input.readUnsignedShort())
                break
            default:
                throw new GradleException("Unsupported constant-pool tag ${tag} while patching ${classFile}")
        }
    }

    output.write(input.readAllBytes())
    output.close()
    input.close()

    if (replacements != 1) {
        throw new GradleException("Expected exactly one ${oldValue} reference in ${classFile}, found ${replacements}")
    }
    classFile.bytes = bytes.toByteArray()
}

// Patch the nested PacketEvents JAR after Loom remaps our mod:
// 1) disable PacketEvents' automatic LOGIN-time Fabric mixins;
// 2) repair its one Minecraft 1.21.1 binary-incompatible method reference.
tasks.register('patchEmbeddedPacketEvents') {
    dependsOn tasks.named('remapJar')

    doLast {
        File outputJar = tasks.named('remapJar').get().archiveFile.get().asFile
        File workDir = layout.buildDirectory.dir('packetevents-patch/outer').get().asFile
        File peWorkDir = layout.buildDirectory.dir('packetevents-patch/inner').get().asFile

        delete workDir
        delete peWorkDir
        workDir.mkdirs()
        peWorkDir.mkdirs()

        copy {
            from zipTree(outputJar)
            into workDir
        }

        File nestedDir = new File(workDir, 'META-INF/jars')
        File packetEventsJar = nestedDir.listFiles()?.find {
            it.isFile() && it.name.startsWith('HYKaKraK-') && it.name.endsWith('.jar')
        }
        if (packetEventsJar == null) {
            throw new GradleException('Embedded PacketEvents jar was not found in META-INF/jars')
        }

        copy {
            from zipTree(packetEventsJar)
            into peWorkDir
        }

        File mixinConfig = new File(peWorkDir, 'packetevents.mixins.json')
        if (!mixinConfig.isFile()) {
            throw new GradleException('packetevents.mixins.json was not found in embedded PacketEvents jar')
        }
        def json = new JsonSlurper().parse(mixinConfig)
        json.mixins = []
        json.client = []
        mixinConfig.text = JsonOutput.prettyPrint(JsonOutput.toJson(json)) + '\n'

        File serverManager = new File(peWorkDir,
                'io/github/retrooper/packetevents/factory/fabric/FabricServerManager.class')
        patchClassUtf8Constant(serverManager, 'comp_4024', 'method_48018')

        packetEventsJar.delete()
        ant.zip(destfile: packetEventsJar.absolutePath) {
            fileset(dir: peWorkDir.absolutePath)
        }

        outputJar.delete()
        ant.zip(destfile: outputJar.absolutePath) {
            fileset(dir: workDir.absolutePath)
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('patchEmbeddedPacketEvents')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
