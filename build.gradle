import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against the PacketEvents API that matches the embedded runtime.
    compileOnly "com.github.retrooper:packetevents-api:${project.packetevents_version}"

    // PacketEvents 2.9.1 is the last runtime we already confirmed can initialize on the
    // target Minecraft 1.21.1 server without the newer comp_4024() binary mismatch.
    // Its stock Fabric mixins are stripped below; ZNPCsPlus performs post-LOGIN,
    // compression-aware injection itself, so the old LOGIN/channel bugs are bypassed.
    modRuntimeOnly "maven.modrinth:HYKaKraK:VzVthUJi"
    include "maven.modrinth:HYKaKraK:VzVthUJi"

    // Storage/import support. Loom includes these as nested runtime libraries.
    include implementation('org.yaml:snakeyaml:2.3')
    include implementation('org.xerial:sqlite-jdbc:3.46.1.3')
    include implementation('com.mysql:mysql-connector-j:9.0.0')
    include implementation('net.kyori:adventure-api:4.18.0')
    include implementation('net.kyori:adventure-text-minimessage:4.18.0')
    include implementation('net.kyori:adventure-text-serializer-legacy:4.18.0')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE')
    from('UPSTREAM-NOTICE.md')
}

// PacketEvents' normal Fabric ConnectionMixin injects during LOGIN. On Velocity-backed
// Fabric servers that can cause the forwarding/login payload to be decoded as a vanilla
// packet. The port does not need PacketEvents in LOGIN at all, so patch the embedded
// PacketEvents jar after remapping and disable its automatic Fabric mixins.
tasks.register('patchEmbeddedPacketEvents') {
    dependsOn tasks.named('remapJar')

    doLast {
        File outputJar = tasks.named('remapJar').get().archiveFile.get().asFile
        File workDir = layout.buildDirectory.dir('packetevents-patch/outer').get().asFile
        File peWorkDir = layout.buildDirectory.dir('packetevents-patch/inner').get().asFile

        delete workDir
        delete peWorkDir
        workDir.mkdirs()
        peWorkDir.mkdirs()

        copy {
            from zipTree(outputJar)
            into workDir
        }

        File nestedDir = new File(workDir, 'META-INF/jars')
        File packetEventsJar = nestedDir.listFiles()?.find {
            it.isFile() && it.name.startsWith('HYKaKraK-') && it.name.endsWith('.jar')
        }
        if (packetEventsJar == null) {
            throw new GradleException('Embedded PacketEvents jar was not found in META-INF/jars')
        }

        copy {
            from zipTree(packetEventsJar)
            into peWorkDir
        }

        File mixinConfig = new File(peWorkDir, 'packetevents.mixins.json')
        if (!mixinConfig.isFile()) {
            throw new GradleException('packetevents.mixins.json was not found in embedded PacketEvents jar')
        }

        def json = new JsonSlurper().parse(mixinConfig)
        json.mixins = []
        json.client = []
        mixinConfig.text = JsonOutput.prettyPrint(JsonOutput.toJson(json)) + '\n'

        packetEventsJar.delete()
        ant.zip(destfile: packetEventsJar.absolutePath) {
            fileset(dir: peWorkDir.absolutePath)
        }

        outputJar.delete()
        ant.zip(destfile: outputJar.absolutePath) {
            fileset(dir: workDir.absolutePath)
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('patchEmbeddedPacketEvents')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
