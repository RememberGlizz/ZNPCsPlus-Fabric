plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // PacketEvents' Fabric distribution contains the API as nested modules.
    // Loom strips nested jars from modImplementation on the development classpath,
    // so compile directly against the published API module.
    compileOnly "com.github.retrooper:packetevents-api:${project.packetevents_version}"

    // Use the real Fabric runtime in development and nest that full Fabric mod
    // inside the final ZNPCsPlus jar. Server owners still install one physical jar.
    modRuntimeOnly "maven.modrinth:HYKaKraK:8s2UbrFH"
    include "maven.modrinth:HYKaKraK:8s2UbrFH"

    // Storage/import support. Loom includes these as nested runtime libraries.
    include implementation('org.yaml:snakeyaml:2.3')
    include implementation('org.xerial:sqlite-jdbc:3.46.1.3')
    include implementation('com.mysql:mysql-connector-j:9.0.0')
    include implementation('net.kyori:adventure-api:4.18.0')
    include implementation('net.kyori:adventure-text-minimessage:4.18.0')
    include implementation('net.kyori:adventure-text-serializer-legacy:4.18.0')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE')
    from('UPSTREAM-NOTICE.md')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
